<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>havenbar-sidebar</title>
    <link rel="stylesheet" href="app.css">
    <link rel="icon" type="image/png" href="images/Logo Icon-Dark 1.svg">
</head>
<body>
   <!-- sidebar.html -->
<aside class="dash-sidebar" id="dashSidebar">
  
  <!-- BRAND HEADER: Perfectly aligns HavenHub typography and logo symbol at the top -->
  <div class="dash-sidebar-header">
    <img src="images/Logo Icon-Dark 1.svg" alt="" class="sidebar-logo-icon">
    <span class="sidebar-brand-name">HAVENHUB</span>
  </div>

  <!-- MAIN NAVIGATION MATRIX CONTAINER -->
  <nav class="dash-nav">
    <div class="dash-nav-items">
      
      <!-- ACTIVE PAGE: Structured to host the white-pill active accent state overlay background -->
      <a href="landlord-dashboard.html" class="dash-nav-link " data-page="landlord-dashboard.html">
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </span>
        <span class="link-text">Dashboard</span>
      </a>

      <a href="inbox.html" class="dash-nav-link" data-page="inbox.html">
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </span>
        <span class="link-text">Inbox</span>
        <span class="dash-badge dash-unread-badge" id="unreadBadge" hidden>0</span>
      </a>

      <!-- COMING SOON VARIANT 1: Dark pill badge styling outline -->
      <button type="button" class="dash-nav-link dash-nav-soon" data-tooltip-label="Tenants &amp; Leases">
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="link-text">Tenants and Leases</span>
        <span class="dash-badge badge-dark">Coming Soon</span>
      </button>

      <!-- COMING SOON VARIANT 2: Bright neon blue solid badge background -->
      <button type="button" class="dash-nav-link dash-nav-soon" data-tooltip-label="ID Verification">
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </span>
        <span class="link-text">ID Verification</span>
        <span class="dash-badge badge-blue">Coming Soon</span>
      </button>

      <a href="settings.html" class="dash-nav-link" data-page="settings.html">
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        <span class="link-text">Settings</span>
      </a>
    </div>
  </nav>
  
  <!-- PROFILE FOOTER SECTOR: Aligned perfectly to support standard user profile metadata loads -->
  <div class="dash-sidebar-footer">
    <div class="dash-profile">
      <!-- Fallback image setup matching the circular avatar placement perfectly -->
      <img src="images/Avatar 4.svg" alt="" class="dash-profile-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://w3.org\' viewBox=\'0 0 24 24\' fill=\'%2364748b\'><circle cx=\'12\' cy=\'8\' r=\'4\'/><path d=\'M5 20v-1a7 7 0 0 1 14 0v1\'/></svg>'">
      <div class="dash-profile-info">
        <span class="dash-profile-name" id="sidebarUserName">john</span>
        <span class="dash-profile-role">Landlord</span>
      </div>
    </div>
    
    <!-- Capsule outline design layout button tracking element -->
    <button class="dash-logout-btn" id="sidebarLogoutBtn" type="button">Log Out</button>
  </div>

  <!-- Add this trigger block to your main dashboard page headers for mobile layouts -->
<button type="button" class="dash-sidebar-toggle" id="sidebarMobileToggle" aria-label="Toggle Navigation Menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

<!-- Optional dim overlay that fades in when sidebar is open on mobile screens -->
<div class="dash-sidebar-overlay" id="sidebarOverlay"></div>

</aside>
<script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
