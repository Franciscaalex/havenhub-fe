<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>havenhub-navbar</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<button class="top-navbar-back-btn" id="navbarBackBtn" type="button" aria-label="Go back">
  <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 15l-5-5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
    <header class="top-navbar">
  <button class="dash-menu-btn" id="dashMenuBtn" type="button" aria-label="Toggle sidebar">
    <span></span><span></span><span></span>
  </button>

  <div class="top-navbar-brand">
    <span class="haven-logo">HAVEN</span><span class="hub-logo">HUB</span>
    <span class="top-navbar-role">Landlord</span>
  </div>

  <div class="dash-welcome">
          <h1 id="dashWelcomeTitle">Welcome back!</h1>
          <p>Here's what's happening across your properties today.</p>
        </div>

        <div class="dash-topbar-actions">
          <div class="dash-search">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M14 14L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" placeholder="Search properties, tenants...">
          </div>

          <button class="dash-icon-btn" type="button" aria-label="Notifications">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 2a5 5 0 00-5 5v3.2L3.4 13a1 1 0 00.9 1.5h11.4a1 1 0 00.9-1.5L15 10.2V7a5 5 0 00-5-5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M8 16.5a2 2 0 004 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
</header>

 <script src="js/api.js"></script>
  <script src="js/main.js"></script> 
  <script src="js/navbar.js"></script>
</body>
</html>
