<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HavenHub - Choose Your Role</title>
  <link rel="icon" type="image/png" href="images/Logo Icon-Dark 1.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body class="role-page">

  <div class="role-options">
      <h2>WHICH ONE ARE YOU?</h2>
      <p>Select the option that best describes what you're here to do. </p>
    </div>
    
  <main class="role-select-wrapper">
    <div class="role-grid" id="roleGrid">
      <button class="role-card" data-role="seeker" type="button" aria-pressed="false">
        <span class="role-image-wrapper">
          <img src="images/seeker.png" alt="Property Seeker">
          <span class="role-checkmark" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </span>
        <span class="role-details">
          <span class="role-title">Seeker</span>
        <span class="role-desc">Find your next home</span>
        </span> 
      </button>

      <button class="role-card" data-role="landlord" type="button" aria-pressed="false">
        <span class="role-image-wrapper">
          <img src="images/Landlord.png" alt="Landlord">
          <span class="role-checkmark" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </span>
        <span class="role-details">
          <span class="role-title">Landlord</span>
        <span class="role-desc">List and manage your properties</span>
        </span>
      </button>

      <button class="role-card" data-role="agent" type="button" aria-pressed="false">
        <span class="role-image-wrapper">
          <img src="images/Agent.png" alt="Agent">
          <span class="role-checkmark" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </span>
        <span class="role-details">
          <span class="role-title">Agent</span>
        <span class="role-desc">Connect buyers with their perfect match</span>
        </span>
      </button>
      <button class="role-card" data-role="manager" type="button" aria-pressed="false">
        <span class="role-image-wrapper">
          <img src="images/Manger.png" alt="Property Manager">
          <span class="role-checkmark" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </span>
        <span class="role-details">
          <span class="role-title"> Manager</span>
        <span class="role-desc">Oversee property with ease</span>
        </span>
      </button>

    </div>

    <p class="role-hint" id="roleHint" aria-live="polite"></p>

    <button class="btn-register-role" id="registerBtn" type="button">Register</button>
  </main>

   <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/roles-select.js"></script>
</body>
</html>
