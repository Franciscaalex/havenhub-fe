<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HavenHub - Landlord Dashboard</title>
    <link rel="icon" type="image/png" href="images/Logo Icon-Dark 1.svg" />
    <link rel="preload" href="sidebar.html" as="fetch" crossorigin>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="global.css">
  </head>
  <body class="dash-body">
    <!-- Mobile-only overlay behind the sliding sidebar -->
    <div class="dash-overlay" id="dashOverlay"></div>
<div id="sidebar-placeholder"></div>
    <div class="dash-shell">

      <!-- ============ MAIN COLUMN ============ -->
      <div class="dash-main">
        <!-- ============ TOPBAR ============ -->
        <header class="dash-topbar">
          <button
            class="dash-menu-btn"
            id="dashMenuBtn"
            type="button"
            aria-label="Toggle sidebar"
          >
            <span></span><span></span><span></span>
          </button>

          <div class="dash-welcome">
            <h1 id="dashWelcomeTitle">Welcome back!</h1>
            <p>Here's what's happening across your properties today.</p>
          </div>

          <div class="dash-topbar-actions">
            <div class="dash-search">
              <svg
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="9"
                  cy="9"
                  r="6"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M14 14L18 18"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
              <input type="text" placeholder="Search properties, tenants..." />
            </div>

            <img
              class="dash-avatar user-avatar-sync"
              src=""
              alt="Your profile"
            />
          </div>
        </header>

        <!-- ============ CONTENT: LOADING SKELETON ============ -->
        <div class="dash-content" id="dashLoading" style="display: block">
          <p class="dash-loading-text">Loading your dashboard...</p>
        </div>

        <!-- ============ CONTENT: EMPTY STATE (NO PROPERTIES YET) ============ -->
        <div
          class="dash-content dash-empty"
          id="dashEmptyState"
          style="display: none"
        >
          <div class="dash-stats-row" id="statsRowEmpty">
            <!-- Filled with $0, -, 0, $0 cards by dashboard-landlord.js -->
          </div>

          <div class="dash-empty-panel">
            <span class="dash-empty-icon" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle
                  cx="20"
                  cy="20"
                  r="19"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M9.5 30.5L30.5 9.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <h2>You haven't listed any properties yet.</h2>
            <p>
              Create your first listing to start reaching verified tenants on
              HavenHub.
            </p>
            <button
              class="dash-btn-primary"
              id="addPropertyBtnEmpty"
              type="button"
            >
              Add a New Property
            </button>
          </div>
        </div>

        <!-- ============ CONTENT: POPULATED STATE (PROPERTIES EXIST) ============ -->
        <!-- Reacts live to API data: chart + colored stat cards appear once
             financial/booking activity starts; until then only the Recent
             Activity panel and property grid render. -->
        <div
          class="dash-content dash-populated"
          id="dashPopulatedState"
          style="display: none"
        >
          <div class="dash-stats-row" id="statsRow">
            <!-- Dynamic Cards filled by dashboard-landlord.js -->
          </div>

          <div class="dash-panels-row" id="panelsRow">
            <!-- Revenue & Expense Chart + Recent activity live renders here -->
          </div>

          <section class="dash-listings-panel">
            <div class="dash-listings-header">
              <h3>Active Property Listings</h3>
            </div>
            <div class="dash-listings-row" id="listingsRow">
              <!-- Active properties with real images and Pending/Available/Rented badges render here -->
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dashboard-landlord.js"></script>
  </body>
</html>
