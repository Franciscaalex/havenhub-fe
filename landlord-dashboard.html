<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HavenHub - Landlord Dashboard</title>
  <link rel="icon" type="image/png" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body class="dash-body">

  <!-- Mobile-only overlay behind the sliding sidebar -->
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-shell">

    <!-- ============ SIDEBAR MODULE HOLDER ============ -->
    <div id="sidebar-placeholder"></div>

    <!-- ============ MAIN COLUMN ============ -->
    <!-- landlord-dashboard.html -->
<div class="dash-main">

  <!-- ============ TOPBAR ============ -->
  <header class="dash-topbar">
    <div class="dash-welcome">
      <h1 id="dashWelcomeTitle">Welcome John!</h1>
      <p>Here's what's happening across your properties today.</p>
    </div>

    <div class="dash-topbar-actions">
      <div class="dash-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="dashboardSearch" placeholder="Search properties, tenants...">
      </div>
    </div>
  </header>

  <!-- ============ DATA MATRIX CONTENT PANEL ============ -->
  <div class="dash-content-body">
    
    <!-- 4 Core Statistics Row Cards Grid -->
    <div class="dash-stats-row">
      <div class="dash-stat-card">
        <span class="dash-stat-label">Total Monthly Revenue</span>
        <span class="dash-stat-value">$0</span>
      </div>
      <div class="dash-stat-card">
        <span class="dash-stat-label">Occupancy Rate</span>
        <span class="dash-stat-value">-</span>
      </div>
      <div class="dash-stat-card">
        <span class="dash-stat-label">Pending Maintenance</span>
        <span class="dash-stat-value">0</span>
      </div>
      <div class="dash-stat-card">
        <span class="dash-stat-label">Overdue Rent</span>
        <span class="dash-stat-value">$0</span>
      </div>
    </div>

    <!-- Empty Notification Panel Canvas Area -->
    <div class="dash-empty-panel">
      <div class="dash-empty-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </div>
      <h2>You haven't listed any properties yet.</h2>
      <p>Create your first listing to start reaching verified tenants on HavenHub.</p>
      
      <!-- Interactive Action Target Button -->
      <button class="dash-btn-primary" id="addPropertyBtnEmpty" type="button">Add a New Property</button>
    </div>

  </div>
  <div id="footer-placeholder"></div>
</div>


  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard-landlord.js"></script>
</body>
</html>
