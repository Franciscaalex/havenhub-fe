<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Havenhub-Saved Properties</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nick.css">
</head>
<body>
  <div id="header-placeholder"></div>
   <!-- <div id="pageHeaderMount"></div> -->
   <!-- <script src="js/header-loader.js"></script> -->


    <main class="page-content">
      <div class="hero">
    <h1 id="savedHeading">My Saved Properties (0)</h1>
    <p>
      Keep track of the homes you are most interested in.
      Your shortlist, all in one place.
    </p>
  </div>

  <div class="saved-toolbar">

    <div class="saved-tabs" id="savedTabs">

      <button class="saved-tab active" data-status="all" type="button">
        All (0)
      </button>

      <button class="saved-tab active" data-status="Available" type="button">
        Available (0)
      </button>

      <button class="saved-tab active" data-status="Rented" type="button">
        Rented (0)
      </button>

    </div>

    <div class="saved-sort">
      <label for="sortSelect" class="sort-label">
        Sort by:
      </label>

      <select id="sortSelect" class="sort-select">
        <option value="newest">Date Added (Newest)</option>
        <option value="oldest">Date Added (Oldest)</option>
        <option value="price-low">Price (Low to High)</option>
        <option value="price-high">Price (High to Low)</option>
      </select>
    </div>

  </div>

  
  <main class="grid" id="propertyGrid"></main>
    </main>
  
  <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/header.js"></script>
  <script src="js/saved.js"></script> 
</body>
</html>
