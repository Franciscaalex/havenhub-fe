<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>havehub-sidenav</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="custom.css">
    <link rel="icon" type="image/png" href="images/Logo Icon-Dark 1.svg">
</head>
<body>    
<aside class="admin-sidebar">

            <div class="sidebar-logo">
                <img src="Group.svg" alt="Logo-icon">
                <div class="logo-name">HAVENHUB</div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="admindash.html" class="nav-link " data-view="view-dashboard">
                            <span class="nav-link-content"><img src="HouseLine.svg" alt=""> Dashboard</span>
                        </a></li>

                    <li><a href="moderation.html" class="nav-link" data-view="view-listings">
                            <span class="nav-link-content"><img src="Chats.svg" alt=""> Moderation Queue</span>
                        </a></li>

                    <li><a href="#" class="nav-link disabled" data-view="view-reports">
                            <span class="nav-link-content"><img src="UserCircle.svg" alt=""> Reports</span>
                            <span class="badge-soon">Coming Soon</span>
                        </a></li>

                    <li><a href="#" class="nav-link disabled" data-view="view-audit">
                            <span class="nav-link-content"><img src="Check.svg" alt=""> Audit Logs</span>
                            <span class="badge-soon">Coming Soon</span>
                        </a></li>

                    <li><a href="#" class="nav-link" data-view="view-settings">
                            <span class="nav-link-content"><img src="Gear.svg" alt=""> Settings</span>
                        </a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="admin-profile">
                    <img src="Ellipse 11.svg" alt="Admin" class="admin-avatar">
                    <div>
                        <p class="admin-name"></p>
                        <p class="admin-role">Admin</p>
                    </div>
                </div>
                <button id="logoutBtn" class="btn-logout">Log Out</button>
            </div>

        </aside>

        <script src="js/api.js" ></script>
        <script src="js/main.js" ></script>
        <script src="js/moderation-init.js" ></script>
        <script src="js/sidebar-toggle.js" ></script>
</body>
</html>
