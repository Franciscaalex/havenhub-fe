<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* ------------------------------------------------------------
       INTELLIGENT HOME ROUTE GATE
       ------------------------------------------------------------ */
    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
    const hasToken = localStorage.getItem('auth_token');
    const selectedRole = localStorage.getItem('selectedRole');

    // 1. If anonymous, go straight to signup
    if (!isLoggedIn || !hasToken) {
      window.location.replace('signup.html');
    } 
    // 2. If registered but hasn't picked a role yet, go to roles selection screen
    else if (!selectedRole) {
      window.location.replace('roles.html');
    }
  </script>
  <!-- Keep your styles, metadata, and link files below -->


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HavenHub - Home</title>
  <link rel="icon" type="image/png" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Elements below only render if a user is logged in and bypasses the gate above -->
  <div id="header-placeholder"></div>

    <!-- Container used by main.js to render live listings -->
    <div id="propertyList" class="property-grid-container" style="margin-top: 30px; display: grid; gap: 20px;"></div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Base system scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
