<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HavenHub - Authentication</title>
  <link rel="icon" type="image/png" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="auth-view active-view">
    <div class="login-bg-wrapper">

<!-- mobile-only -->
      <div class="brand-header mobile-only">
        <img src="images/HavenHubLogo-iconmark-.png" alt="HavenHub Logo" class="brand-icon">
        <h2 class="brand-name">HAVENHUB</h2>
        <h1 class="form-title">LOGIN</h1>
        <p class="form-subtitle">Welcome back, please login to your account</p>
      </div>

      <!-- main login contianer -->
      <div class="login-card-container">

        <!-- Desktop header -->
        <div class="brand-header desktop-only">
          <img src="images/HavenHubLogo-iconmark-.png" alt="HavenHub Logo" class="brand-icon">
          <h2 class="brand-name">HAVENHUB</h2>
          <h1 class="form-title">LOGIN</h1>
          <p class="form-subtitle">Welcome back, please login to your account</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <input type="email" id="loginEmail" class="form-control" placeholder="Enter a valid email address">
            <span class="error-message">Incorrect email address</span>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <input type="password" id="loginPassword" class="form-control" placeholder="********">
              <img src="images/EyeClosed.png" alt="TogglePassword" class="toggle-password-img" data-target="loginPassword">
            </div>
            <span class="error-message">Password is required</span>
          </div>

          <div class="forgot-link-wrapper">
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <div class="form-status" id="loginStatus" aria-live="polite"></div>

          <button type="submit" class="btn-submit">Login</button>

          <div class="signup-footer">
            <span>Don't have an account? </span>
            <a href="signup.html" id="switchToSignup" class="signup-link">Sign Up</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
