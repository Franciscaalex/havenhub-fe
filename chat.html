<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Havenhub-Message</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>

   <div class="nav-bar-header">
      <div class="logo-container">
        <img src="assets/HavenHub-03 2.svg" alt="havenhub-logo">
        <div class="header-text"> Landlord </div>
       </div>

     <h1 class="header-tittle">Messages & Enquiries</h1>

        <div class="header-actions">
          <input type="text" placeholder="Search conversations..." class="search-input">
        </div>
   </div>

    <div class="messages-page-layout">

        <div id="sidebar-placeholder"></div>

        <div class="messages-page">

            <h3 class="conversations-heading">Conversations</h3>

            <div class="conversation-tabs">
                <button type="button" id="tabAll" class="tab-btn active">All (0)</button>
                <button type="button" id="tabUnread" class="tab-btn">Unread (0)</button>
                <button type="button" id="tabArchive" class="tab-btn">Archive (0)</button>
            </div>

            <div class="conversations-list" id="conversationsList"></div>

        </div>

    </div>

    <div id="footer-placeholder"></div>



<script src="api.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
