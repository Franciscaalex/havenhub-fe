<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HavenHub — Property Details</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="details-header">
    <a href="index.html" class="details-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span class="details-back-text">Back to Listings</span>
    </a>
    <div class="details-crumb">
      <img src="logo-icon.png" alt="">
      <span class="logo-text">HAVENHUB</span>
      <span class="details-crumb-page">Property Details</span>
    </div>
    <a href="index.html" class="details-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </a>
  </header>

  <main id="detailsRoot">
    <div class="details-container">
      <div class="empty-state" style="grid-column:1/-1;">
        <p>Loading property…</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"> </footer>

  <script src="details.js"></script>

</body>
</html>
